<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario</title>
    <!-- Cargamos la librería oficial para escanear desde el navegador -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding: 20px; background-color: #f5f7fb; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        h2 { margin-bottom: 5px; }
        .subtitle { color: #666; margin-bottom: 20px; }
        #reader { width: 100%; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        .status-box { background: #e3f2fd; border: 1px solid #90caf9; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .sync-box { background: #fff3e0; border: 1px solid #ffe0b2; padding: 15px; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: #a0aec0; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button.active { background: #3182ce; }
    </style>
</head>
<body>

<div class="container">
    <h2>Control de Inventario</h2>
    <p class="subtitle">Apunta al código de barras del producto</p>

    <!-- AQUÍ SE MOSTRARÁ LA CÁMARA -->
    <div id="reader" style="width: 100%; max-width: 500px; margin: 0 auto;"></div>

    <!-- Contenedor para mostrar los datos devueltos por ServidorInventario.java -->
    <div id="resultado" style="margin-top: 20px; font-size: 1.2em; text-align: center;">
        Esperando código de barras...
    </div>

    <div class="status-box">
        <strong id="codigo-resultado">Último código: Esperando...</strong>
        <div style="color: #555; font-size: 14px; margin-top: 5px;">Listo para escanear</div>
    </div>

    <div class="sync-box">
        <span style="color: #e65100; font-weight: bold;">Códigos pendientes: <span id="contador">0</span></span>
        <button id="btn-sync" onclick="sincronizarPostgres()">🔄 Sincronizar con PostgreSQL</button>
    </div>
</div>

<script>
let codigosPendientes = [];
let html5QrcodeScanner; 

// NUEVAS VARIABLES PARA CONTROLAR LOS DUPLICADOS
let ultimoCodigoLeido = "";
let ultimaHoraLectura = 0;
const TIEMPO_ESPERA_MS = 3000; 

// 🚨 LÍNEA AGREGADA: Dirección de tu ServidorInventario.java híbrido (Modificar según entorno)
const SERVIDOR_API = 'http://192.168.1.223:8080'; 

function iniciarCamara() {
    if (typeof Html5QrcodeScanner === 'undefined' || typeof Html5QrcodeSupportedFormats === 'undefined') {
        console.error("❌ Error: Librería ausente.");
        return;
    }

    const config = { 
        fps: 24, 
        qrbox: { width: 280, height: 130 }, 
        rememberLastUsedCamera: true,
        experimentalFeatures: {
            useBarCodeDetectorIfSupported: true 
        },
        formatsToSupport: [ 
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.QR_CODE
        ],
        videoConstraints: {
            facingMode: { exact: "environment" }, 
            focusMode: "continuous",              
            width: { ideal: 1280 },               
            height: { ideal: 720 }
        }
    };

    html5QrcodeScanner = new Html5QrcodeScanner("reader", config, false);
    
    html5QrcodeScanner.render(onScanSuccess, onScanFailure)
        .then(() => {
            console.log("✅ Cámara inicializada.");
            setTimeout(() => {
                const videoEl = document.querySelector("#reader video");
                if (videoEl) {
                    videoEl.style.transform = "scaleX(1)";
                }
            }, 800);
        })
        .catch(err => {
            console.error("❌ Error de cámara:", err);
        });
}


function onScanSuccess(decodedText, decodedResult) {
    const ahora = Date.now();
    
    if (decodedText === ultimoCodigoLeido && (ahora - ultimaHoraLectura) < TIEMPO_ESPERA_MS) {
        return; 
    }
    
    ultimoCodigoLeido = decodedText;
    ultimaHoraLectura = ahora;

    console.log(`🎯 ¡Código detectado de forma única!: ${decodedText}`);
    
    const resultadoEl = document.getElementById("codigo-resultado");
    resultadoEl.innerText = `Último código: ${decodedText}`;
    
    const statusBox = document.querySelector(".status-box");
    statusBox.style.background = "#c8e6c9"; 
    setTimeout(() => {
        statusBox.style.background = "#e3f2fd"; 
    }, 1000);
    
    codigosPendientes.push(decodedText);
    document.getElementById("contador").innerText = codigosPendientes.length;
    
    const btn = document.getElementById("btn-sync");
    btn.classList.add("active");
}

function onScanFailure(error) {
    // Silencioso para evitar saturar la consola
}

// 🚨 FUNCIÓN CORREGIDA Y COMPLETADA
function sincronizarPostgres() {
    if(codigosPendientes.length === 0) {
        alert("No hay códigos para sincronizar.");
        return;
    }
    
    // Detener el escáner mientras procesamos la red
    html5QrcodeScanner.clear(); 
    
    document.getElementById('resultado').innerText = `Sincronizando ${codigosPendientes.length} códigos con PostgreSQL...`;
    
    // Como tu backend lee un código a la vez por parámetro (?codigo=XYZ), 
    // tomamos el ÚLTIMO código escaneado de la lista para consultarlo.
    const codigoAEnviar = codigosPendientes[codigosPendientes.length - 1];
    const urlServidor = `${SERVIDOR_API}/api/inventario/escanear?codigo=${encodeURIComponent(codigoAEnviar)}`;
    
    // Hacer la petición HTTP a tu ServidorInventario.java
    fetch(urlServidor)
        .then(response => {
            if (response.status === 404) throw new Error("Producto no registrado en PostgreSQL");
            if (!response.ok) throw new Error("Error de conexión con el servidor");
            return response.json();
        })
        .then(data => {
            // Renderizar la respuesta del servidor en la pantalla del iPhone/Mac
            if(data.status === "success") {
                document.getElementById('resultado').innerHTML = `
                    <div style="background: #c8e6c9; padding: 12px; border-radius: 8px; border: 1px solid #81c784; margin-bottom: 10px; color: #1b5e20;">
                        <strong>📦 Producto:</strong> ${data.nombre}<br>
                        <strong>💰 Precio:</strong> $${data.precio.toFixed(2)}<br>
                        <strong>🔢 Stock:</strong> ${data.stock} unidades
                    </div>
                `;
            }
        })
        .catch(error => {
            console.error("Error:", error);
            document.getElementById('resultado').innerHTML = `
                <div style="background: #ffcdd2; padding: 12px; border-radius: 8px; border: 1px solid #e57373; color: #b71c1c;">
                    ⚠️ ${error.message}
                </div>
            `;
        })
        .finally(() => {
            // Limpiar la cola local tras intentar la sincronización
            codigosPendientes = [];
            document.getElementById("contador").innerText = "0";
            document.getElementById("btn-sync").classList.remove("active");

            // Reiniciar el escáner automáticamente para el siguiente producto
            setTimeout(() => {
                document.getElementById('resultado').innerText = "Esperando código de barras...";
                html5QrcodeScanner.render(onScanSuccess, onScanFailure);
            }, TIEMPO_ESPERA_MS);
        });
}

// 🚨 LÍNEA AGREGADA CRÍTICA: Encender la cámara automáticamente al cargar la página
window.addEventListener('DOMContentLoaded', iniciarCamara);
</script>
</body>
</html>
