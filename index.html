<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario</title>
    <!-- Cargamos la librería oficial para escanear desde el navegador -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding: 20px; background-color: #f5f7fb; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        h2 { margin-bottom: 5px; }
        .subtitle { color: #666; margin-bottom: 20px; }
        #reader { width: 100%; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
        .status-box { background: #e3f2fd; border: 1px solid #90caf9; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .sync-box { background: #fff3e0; border: 1px solid #ffe0b2; padding: 15px; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: #a0aec0; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button.active { background: #3182ce; }
    </style>
</head>
<body>

<div class="container">
    <h2>Control de Inventario</h2>
    <p class="subtitle">Apunta al código de barras del producto</p>

    <!-- AQUÍ SE MOSTRARÁ LA CÁMARA -->
    <div id="reader"></div>

    <div class="status-box">
        <strong id="codigo-resultado">Último código: Esperando...</strong>
        <div style="color: #555; font-size: 14px; margin-top: 5px;">Listo para escanear</div>
    </div>

    <div class="sync-box">
        <span style="color: #e65100; font-weight: bold;">Códigos pendientes: <span id="contador">0</span></span>
        <button id="btn-sync" onclick="sincronizarPostgres()">🔄 Sincronizar con PostgreSQL</button>
    </div>
</div>

<script>
    let codigosPendientes = [];
let html5QrcodeScanner; // Declaramos la variable globalmente

// NUEVAS VARIABLES PARA CONTROLAR LOS DUPLICADOS
let ultimoCodigoLeido = "";
let ultimaHoraLectura = 0;
const TIEMPO_ESPERA_MS = 3000; // 3 segundos de espera para el mismo código


function iniciarCamara() {
    // 1. Verificación de seguridad de la librería
    if (typeof Html5QrcodeScanner === 'undefined' || typeof Html5QrcodeSupportedFormats === 'undefined') {
        console.error("❌ Error crítico: La librería html5-qrcode no se ha cargado completamente en el navegador.");
        return;
    }

    console.log("🔄 Configurando escáner para códigos de barras...");

    const config = { 
        fps: 20, // Mayor velocidad de fotogramas para capturar el código rápido
        qrbox: { width: 320, height: 160 }, 
        rememberLastUsedCamera: true,
        experimentalFeatures: {
            useBarCodeDetectorIfSupported: true // Utiliza aceleración de hardware si el navegador lo permite
        },
        // Formatos comerciales estándar ordenados por prioridad
        formatsToSupport: [ 
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.QR_CODE
        ]
    };

    // Crear el escáner desactivando el modo espejo (esencial para MacBook)
    html5QrcodeScanner = new Html5QrcodeScanner("reader", config, /* verbose= */ false);
    
    html5QrcodeScanner.render(onScanSuccess, onScanFailure)
        .then(() => {
            console.log("✅ Cámara inicializada exitosamente.");
            // Forzar desactivación de espejo en el elemento de video si existe
            setTimeout(() => {
                const videoEl = document.querySelector("#reader video");
                if (videoEl) {
                    videoEl.style.transform = "scaleX(1)"; // Quita el modo espejo de la Mac
                    console.log("📸 Modo espejo desactivado para lectura lineal.");
                }
            }, 1000);
        })
        .catch(err => {
            console.error("❌ Error al renderizar la cámara:", err);
        });
}

function onScanSuccess(decodedText, decodedResult) {
    const ahora = Date.now();
    
    // Si es el mismo código y no han pasado 3 segundos, lo ignoramos
    if (decodedText === ultimoCodigoLeido && (ahora - ultimaHoraLectura) < TIEMPO_ESPERA_MS) {
        return; // Salir de la función sin hacer nada
    }
    
    // Actualizar el registro del último código leído
    ultimoCodigoLeido = decodedText;
    ultimaHoraLectura = ahora;

    console.log(`🎯 ¡Código detectado de forma única!: ${decodedText}`);
    
    // Actualizar interfaz visual
    const resultadoEl = document.getElementById("codigo-resultado");
    resultadoEl.innerText = `Último código: ${decodedText}`;
    
    // Feedback visual temporal: Poner fondo verde en el contenedor del texto
    const statusBox = document.querySelector(".status-box");
    statusBox.style.background = "#c8e6c9"; // Verde claro
    setTimeout(() => {
        statusBox.style.background = "#e3f2fd"; // Vuelve al azul original
    }, 1000);
    
    // Agregar a la lista para PostgreSQL
    codigosPendientes.push(decodedText);
    document.getElementById("contador").innerText = codigosPendientes.length;
    
    // Activar botón de sincronización
    const btn = document.getElementById("btn-sync");
    btn.classList.add("active");
}

function onScanFailure(error) {
    // El escáner analiza cuadros por segundo constantemente. 
    // Dejar vacío para no inundar la consola de errores de "código no detectado".
}

function sincronizarPostgres() {
    if(codigosPendientes.length === 0) {
        alert("No hay códigos para sincronizar.");
        return;
    }
    
    alert(`Sincronizando ${codigosPendientes.length} códigos con PostgreSQL...`);
    // Tu futura integración con ServidorInventario.java irá aquí
    
    codigosPendientes = [];
    document.getElementById("contador").innerText = "0";
    document.getElementById("btn-sync").classList.remove("active");
}

// Evento moderno y seguro que espera que todo el HTML y scripts externos estén listos
document.addEventListener("DOMContentLoaded", iniciarCamara);

</script>

</body>
</html>
